# XcodeGen spec. Generates the Xcode project reproducibly from text,
# instead of maintaining a .pbxproj binary by hand (which barely merges
# conflict-free under parallel changes). On a Mac:
#
#   brew install xcodegen
#   cd iosApp && xcodegen generate
#
# The shared framework is NOT wired in here — KMP frameworks can't be
# declared as an ordinary dependency in XcodeGen, because the generated
# .framework only comes into existence through the Gradle build. Instead,
# the generated Xcode target needs a "Run Script" build phase that calls
#   ../gradlew :shared:embedAndSignAppleFrameworkForXcode
# before compiling (standard CocoaPods-less KMP embedding, see the
# Kotlin Multiplatform docs "Add a KMP framework to Xcode without
# CocoaPods"). This script phase is marked as a TODO below under
# `postCompileScripts`/`preBuildScripts`, because the concrete framework
# target (iosArm64 vs. iosSimulatorArm64) can only be verified with an
# actual Mac toolchain run (see ARCHITECTURE.md, open point 1).

name: PowerTrip

options:
  bundleIdPrefix: org.julakali
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Only our targets: the Swift packages' warnings are not ours to fix.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    DEVELOPMENT_TEAM: "" # fill in before the first build in the Xcode project
    # CHARGEAHEAD_BASE_URL and CHARGEAHEAD_TOKEN come only from Secrets.xcconfig:
    # a value here, even an empty one, would override the xcconfig.

packages:
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.6

configFiles:
  # If the file doesn't exist, XcodeGen ignores the entry — the build then
  # succeeds, but the app stops at launch without a backend.
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

targets:
  PowerTrip:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PowerTrip
    # No `info:` block: XcodeGen would REGENERATE the plist and silently
    # drop the hand-maintained keys (CarPlay scene manifest). The existing
    # file is used as-is instead.
    entitlements:
      path: PowerTrip/PowerTrip.entitlements
      properties:
        com.apple.developer.carplay-charging: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.julakali.chargeahead
        PRODUCT_NAME: PowerTrip
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: PowerTrip/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: false # UILaunchScreen is already in Info.plist
        # Confirmed by the first Mac build (2026-09-07): the embed task writes
        # the framework to shared/build/xcode-frameworks/<Configuration>/<sdk>.
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "Shared"
    preBuildScripts:
      - name: "Build and embed Shared.framework (KMP, no CocoaPods)"
        script: |
          cd "$SRCROOT/.."
          # Xcode's script phases don't inherit the shell's JAVA_HOME; take
          # the JDK Gradle was verified with, or whatever the machine has.
          export JAVA_HOME="${JAVA_HOME:-$(/usr/libexec/java_home 2>/dev/null || true)}"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false

  # Taps through the app in the simulator: tools/ios-sim.sh uitest.
  PowerTripUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PowerTripUITests
    dependencies:
      - target: PowerTrip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.julakali.chargeahead.uitests
        GENERATE_INFOPLIST_FILE: true

  # Screens and markers against their goldens: tools/check.sh ios.
  PowerTripSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PowerTripSnapshotTests
        excludes:
          - "**/__Snapshots__/**"
    dependencies:
      - target: PowerTrip
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.julakali.chargeahead.snapshottests
        GENERATE_INFOPLIST_FILE: true
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"

schemes:
  PowerTrip:
    build:
      targets:
        PowerTrip: all
        PowerTripUITests: [test]
        PowerTripSnapshotTests: [test]
    test:
      targets:
        - PowerTripUITests
        - PowerTripSnapshotTests


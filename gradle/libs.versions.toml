[versions]
agp = "9.4.0"
kotlin = "2.4.20"
composePlugin = "1.12.1"

compileSdk = "37"
minSdk = "26"
targetSdk = "37"

carApp = "1.7.0"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"
ktor = "3.6.0"
room = "2.8.5"
androidxSqlite = "2.7.1"
datastore = "1.2.1"
ksp = "2.3.11"
koin = "4.2.2"
navigation3 = "1.1.7"

activityCompose = "1.13.0"
composeBom = "2026.09.00"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
playServicesLocation = "21.4.0"
playServicesMaps = "20.0.0"
mapsCompose = "8.6.0"
composeCache = "3.0.1"
aboutLibraries = "15.2.0"
skie = "0.10.15"

chargeaheadApi = "0.19.0"

# UI tests (:ui-tests)
screenshot = "0.0.1-alpha15"
robolectric = "4.17"
junit4 = "4.13.2"
androidxTestExtJunit = "1.3.0"
androidxTestCore = "1.7.0"

[libraries]
# --- shared (Kotlin Multiplatform) ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# Only for ViewModel tests: viewModelScope runs on the Main dispatcher, which
# a plain JVM test JVM does not have. Dispatchers.setMain supplies one.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# ViewModel, multiplatform: AndroidX publishes this artifact for iOS and JVM
# too, so the shared ViewModels compile for every target (plans/technical-debts).
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
# SavedStateHandle, so ViewModel state survives process death. Multiplatform
# like the ViewModel artifact itself.
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }

# The backend's wire contract. Served from the backend itself, see
# settings.gradle.kts.
chargeahead-api-model = { module = "org.julakali.powertrip:api-model", version.ref = "chargeaheadApi" }
chargeahead-vehicle-model = { module = "org.julakali.powertrip:vehicle-model", version.ref = "chargeaheadApi" }

# --- HTTP (ab M1: OpenChargeMap) ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
# Engines: je Ziel eine, weil Ktor keine gemeinsame hat.
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

# --- Persistence (M3 tile cache; Room KMP since the technical-debt round) ---
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# Bundled instead of platform SQLite: the same SQLite version on every target.
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidxSqlite" }

# --- Settings (#82): multiplatform key-value store; the Android variant also
# brings SharedPreferencesMigration. ---
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# --- DI (Koin, plain DSL — technical-debts: no annotations) ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
# ViewModel DSL (viewModelOf) usable from commonMain — Koin 4's multiplatform ViewModel API.
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

# --- Navigation (phone app only — the car has the Car App Library's own stack) ---
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

# --- Android Auto ---
car-app = { module = "androidx.car.app:app", version.ref = "carApp" }
car-app-projected = { module = "androidx.car.app:app-projected", version.ref = "carApp" }
# TestCarContext & co. for the car screens' unit tests (:androidApp).
car-app-testing = { module = "androidx.car.app:app-testing", version.ref = "carApp" }

# --- Android phone UI ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version = "1.0.1" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
screenshot-validation-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "screenshot" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
# Google's full Material icon set (EvStation etc.) — R8 strips the unused rest.
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
# Local cache for text fields bound to a ViewModel: keeps keystrokes that the
# asynchronous uiState round trip would otherwise overwrite.
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composePlugin" }
compose-mp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composePlugin" }
compose-cache = { module = "de.charlex.compose:compose-cache", version.ref = "composeCache" }

# Open-source licence list; the Gradle plugin generates the data at build time.
aboutlibraries-compose-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutLibraries" }

maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "mapsCompose" }
play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "playServicesMaps" }

play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
aboutlibraries-android = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutLibraries" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composePlugin" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }

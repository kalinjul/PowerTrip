# Publishing a GitHub release ships the app to the Play internal test track.
#
# Deliberately "released/published" and not a tag push: the release is the
# one place where a human decides that this state goes out, and it carries
# the release notes with it. workflow_dispatch exists for re-runs after a
# failed upload -- rebuilding the same tag is safe, fastlane asks Play for a
# fresh versionCode every time.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to build
        required: true
      version_name:
        description: 'versionName for the build (default: the ref, without a leading "v")'
        required: false

# Two uploads at the same time would race for the version code.
concurrency:
  group: release-play
  cancel-in-progress: false

permissions:
  contents: read

# Read by settings.gradle.kts to resolve org.julakali.powertrip:api-model.
env:
  CHARGEAHEAD_MAVEN_USER: ${{ secrets.CHARGEAHEAD_MAVEN_USER }}
  CHARGEAHEAD_MAVEN_PASSWORD: ${{ secrets.CHARGEAHEAD_MAVEN_PASSWORD }}

jobs:
  play-internal:
    name: Play Store (internal track)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name }}

      - name: Derive versionName
        id: version
        env:
          RAW: ${{ inputs.version_name || inputs.ref || github.event.release.tag_name }}
        run: |
          # Tags are cut as v0.2.0; the versionName the user sees must not
          # carry the v. Anything that is not a tag is passed through as is.
          echo "name=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Materialize signing and Play credentials
        id: credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          # RUNNER_TEMP, not the workspace: nothing here may end up in an
          # artifact or in a Gradle cache entry.
          keystore="$RUNNER_TEMP/release.keystore"
          json_key="$RUNNER_TEMP/play-service-account.json"

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error title=Missing secret::ANDROID_KEYSTORE_BASE64 is not set (docs/ci-cd.md)."
            exit 1
          fi
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error title=Missing secret::PLAY_SERVICE_ACCOUNT_JSON is not set (docs/ci-cd.md)."
            exit 1
          fi

          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$json_key"

          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"
          echo "json_key=$json_key" >> "$GITHUB_OUTPUT"

      - name: Build and upload to the internal track
        env:
          # Read by androidApp/build.gradle.kts.
          KEYSTORE_FILE: ${{ steps.credentials.outputs.keystore }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # The token is extractable from the APK - the backend's daily quota
          # is what limits the damage.
          CHARGEAHEAD_BASE_URL: ${{ vars.CHARGEAHEAD_BASE_URL }}
          CHARGEAHEAD_TOKEN: ${{ secrets.CHARGEAHEAD_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          # Read by fastlane (Appfile) and by supply itself.
          PLAY_JSON_KEY_FILE: ${{ steps.credentials.outputs.json_key }}
          SUPPLY_JSON_KEY: ${{ steps.credentials.outputs.json_key }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: bundle exec fastlane android internal

      - name: Remove credentials from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/play-service-account.json"

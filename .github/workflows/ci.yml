# Build and test on main and on every pull request against main.
#
# Deliberately separate jobs, not one: the Kotlin/Native job downloads the
# ~1 GB Konan toolchain and would otherwise stretch the Android feedback
# from a few minutes to well over ten. A pull request only runs the jobs of
# the app it touches (tools/changed-sides.sh); main always runs everything.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Started by ios-goldens.yml after it commits, since a push with the
  # workflow token triggers no workflow of its own.
  workflow_dispatch:

# Superseded pull request runs are pointless; a superseded main run is not
# (it is the one that says whether main is green).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Read by settings.gradle.kts to resolve org.julakali.powertrip:api-model.
env:
  CHARGEAHEAD_MAVEN_USER: ${{ secrets.CHARGEAHEAD_MAVEN_USER }}
  CHARGEAHEAD_MAVEN_PASSWORD: ${{ secrets.CHARGEAHEAD_MAVEN_PASSWORD }}

# The only secret here is the Maven access to the contract module: without it
# nothing resolves and nothing compiles. That is the price of serving
# api-model from our own backend, and it means a pull request from a fork
# cannot be built here.
#
# No backend or map keys: the build does not need them, only a running app
# does.
jobs:
  changes:
    name: Which app changed
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.sides.outputs.android }}
      ios: ${{ steps.sides.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The sorting rules still hold
        run: tools/changed-sides.test.sh

      - name: Sort the changed files
        id: sides
        run: |
          if [ "${{ github.event_name }}" = push ] || [ "${{ github.ref }}" = refs/heads/main ]; then
            sides="android ios"
          else
            sides="$(tools/check.sh sides --base origin/main)"
          fi
          echo "Sides: ${sides:-none}"
          case " $sides " in *" android "*) echo "android=true" >> "$GITHUB_OUTPUT" ;; esac
          case " $sides " in *" ios "*) echo "ios=true" >> "$GITHUB_OUTPUT" ;; esac

  # A skipped job counts as passed for the required checks, so when the
  # sorting itself fails, every job runs.
  android:
    name: Android build + shared tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Android Studio's bundled JBR is 25; the screenshot goldens are rendered
      # with it, so CI validates with the same one.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Accepts the SDK licenses and puts the command line tools on PATH;
      # AGP downloads what is missing beyond that itself.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the Maven credentials
        # Without them every Gradle task dies at dependency resolution with a
        # 401 that says nothing about the cause. A fork's pull request never
        # sees secrets, so this is where that run stops, legibly.
        run: |
          if [ -z "${CHARGEAHEAD_MAVEN_USER:-}" ] || [ -z "${CHARGEAHEAD_MAVEN_PASSWORD:-}" ]; then
            echo "::error title=No Maven credentials::org.julakali.powertrip:api-model cannot be resolved. Pull requests from forks do not get secrets and cannot be built here."
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Shared tests (JVM target)
        # The live contract tests against the backend stay off (they only run
        # with POWERTRIP_LIVE=1): a test that goes red because a server
        # hiccups says nothing about this repository. AGENTS.md, "Tests".
        run: ./gradlew :shared:jvmTest

      - name: Phone UI behaviour tests (Robolectric)
        run: ./gradlew :ui-tests:testDebugUnitTest

      - name: Phone UI screenshot tests
        # Compares against the goldens in ui-tests/src/screenshotTestDebug/reference.
        # A real change needs `./gradlew :ui-tests:updateDebugScreenshotTest`
        # and the new PNGs committed; the HTML report below shows the diff.
        run: ./gradlew :ui-tests:validateDebugScreenshotTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            ui-tests/build/reports/tests/
            ui-tests/build/test-results/
            ui-tests/build/reports/screenshotTest/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 1

  ios-kotlin:
    name: Kotlin/Native (iosMain)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ios == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the Maven credentials
        # Without them every Gradle task dies at dependency resolution with a
        # 401 that says nothing about the cause. A fork's pull request never
        # sees secrets, so this is where that run stops, legibly.
        run: |
          if [ -z "${CHARGEAHEAD_MAVEN_USER:-}" ] || [ -z "${CHARGEAHEAD_MAVEN_PASSWORD:-}" ]; then
            echo "::error title=No Maven credentials::org.julakali.powertrip:api-model cannot be resolved. Pull requests from forks do not get secrets and cannot be built here."
            exit 1
          fi

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Compiles, but does not link: linkDebugFrameworkIos* needs Apple's
      # linker and is skipped by the Kotlin plugin on a non-macOS host. So
      # this checks iosMain against the real CoreLocation/Foundation/UIKit
      # cinterop bindings -- and produces no framework and no Objective-C
      # header (shared/build.gradle.kts says the same at more length).
      - name: Compile iosMain
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64

  swift-syntax:
    name: Swift syntax check
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ios == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # swiftc -parse finds syntax errors and nothing else -- no type errors,
      # no resolved imports. A real check needs a Mac (iosApp/README.md).
      # If the runner image has no Swift, that is worth a warning but not a
      # red build: the check was never load-bearing.
      - name: Check Swift syntax
        run: |
          if ! command -v swiftc >/dev/null 2>&1; then
            echo "::warning title=Swift unchecked::No swiftc on the runner -- the Swift files in iosApp/ are syntactically unverified in this run."
            exit 0
          fi
          tools/check-swift.sh

  ios:
    name: iOS app + snapshot goldens
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ios == 'true') }}
    # The goldens' Xcode and simulator (tools/ios-toolchain.env) are installed there.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check the Maven credentials
        run: |
          if [ -z "${CHARGEAHEAD_MAVEN_USER:-}" ] || [ -z "${CHARGEAHEAD_MAVEN_PASSWORD:-}" ]; then
            echo "::error title=No Maven credentials::org.julakali.powertrip:api-model cannot be resolved. Pull requests from forks do not get secrets and cannot be built here."
            exit 1
          fi

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Install xcodegen and the pinned simulator
        run: |
          brew install xcodegen
          . tools/ios-toolchain.env
          if ! grep -q "iOS $IOS_RUNTIME " <<< "$(xcrun simctl list runtimes)"; then
            sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
            xcodebuild -downloadPlatform iOS -buildVersion "$IOS_RUNTIME"
          fi

      # The UI tests stay local: they need the backend, CI has no keys for it.
      - name: iOS gates
        run: tools/check.sh ios

      - name: Upload the differing snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-snapshot-failures
          path: iosApp/build/check/snapshot-failures/
          retention-days: 7
